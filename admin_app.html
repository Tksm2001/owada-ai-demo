<title>AI秘書 管理画面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* restyle-v2 */
:root{--bg:#f4f2ec;--paper:#ffffff;--paper2:#faf8f3;--ink:#1a1d22;--ink2:#4a5058;--ink3:#7c8189;--line:#e3dfd6;--line2:#efece5;--pri:#0f3d5c;--pri-s:#e3edf4;--acc:#e8752a;--acc-s:#fdebdc;--good:#2f8f5b;--good-s:#e2f3e8;--warn:#c98a12;--warn-s:#fbf0d5;--bad:#c23b3b;--bad-s:#fae3e3;--side:#0f3d5c;--side2:#0b3049;--side-ink:#d7e3ec;--shadow:0 1px 2px rgba(20,25,35,.05),0 6px 20px -12px rgba(20,25,35,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--paper:#1e2229;--paper2:#232830;--ink:#eae7e0;--ink2:#b9b4aa;--ink3:#868270;--line:#2f353e;--line2:#282d35;--pri:#9cc3e0;--pri-s:#1f3243;--acc:#f0925a;--acc-s:#3d2a1c;--good:#7fc79a;--good-s:#1f3a2a;--warn:#e0b060;--warn-s:#3a3120;--bad:#e08a87;--bad-s:#3d2626;--side:#0d1a25;--side2:#0a141d;--side-ink:#b9c8d4;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#15181d;--paper:#1e2229;--paper2:#232830;--ink:#eae7e0;--ink2:#b9b4aa;--ink3:#868270;--line:#2f353e;--line2:#282d35;--pri:#9cc3e0;--pri-s:#1f3243;--acc:#f0925a;--acc-s:#3d2a1c;--good:#7fc79a;--good-s:#1f3a2a;--warn:#e0b060;--warn-s:#3a3120;--bad:#e08a87;--bad-s:#3d2626;--side:#0d1a25;--side2:#0a141d;--side-ink:#b9c8d4;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,.tile b,.brand,.ttl,.date b,td.n,.ic,.n{font-family:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--side),var(--side2));color:var(--side-ink);padding:22px 14px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
aside .brand{font-weight:900;font-size:21px;color:#fff;margin:0 10px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
aside .brand em{font-style:normal;width:32px;height:32px;border-radius:10px;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:900}
aside .co{font-size:13px;color:#fff;opacity:.92;margin:8px 10px 22px;display:flex;align-items:center;font-weight:700}
aside button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--side-ink);font:inherit;font-size:15.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;position:relative}
aside button svg{width:20px;height:20px;flex:none;opacity:.85}
aside button .n{margin-left:auto;background:var(--acc);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:0 8px;line-height:20px}
aside button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
aside button.on svg{opacity:1}
aside button:hover:not(.on){background:rgba(255,255,255,.07)}
aside button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
aside .sep{height:1px;background:rgba(255,255,255,.12);margin:8px 10px}
aside .foot{margin-top:auto;font-size:11.5px;opacity:.6;padding:0 10px;line-height:1.5}
main{padding:0 32px 56px;min-width:0;max-width:1320px}
.top{display:flex;align-items:center;gap:16px;padding:18px 0 12px;margin-bottom:4px;flex-wrap:wrap}
.top h1{font-size:26px;margin:0;font-weight:900;letter-spacing:.01em}
.date{display:flex;align-items:center;gap:4px;margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 6px;box-shadow:var(--shadow)}
.date button{background:none;border:0;font-size:20px;cursor:pointer;color:var(--ink2);padding:0 10px;border-radius:8px;line-height:1.3}
.date button:hover{background:var(--bg)}
.date b{font-variant-numeric:tabular-nums;min-width:136px;text-align:center;font-weight:700;font-size:16px}
.date input{width:150px;accent-color:var(--pri)}
.live{font-size:13px;color:var(--ink3);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:0}
.dot.w{background:var(--warn)}.dot.x{background:var(--ink3)}
.greet{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:14px;padding:16px 20px;margin:8px 0 20px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:flex-start}
.greet .av{width:44px;height:44px;border-radius:50%;background:var(--acc-s);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:none;font-family:"Zen Kaku Gothic New",sans-serif}
.greet p{margin:0;font-size:17px;line-height:1.75}
.greet p b{color:var(--pri)}
.greet small{display:block;color:var(--ink3);font-size:12.5px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile span{display:block;font-size:13px;color:var(--ink3);font-weight:700;letter-spacing:.02em}
.tile b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--pri);margin-top:4px;line-height:1.2;letter-spacing:-.01em}
.tile small{display:block;font-size:12.5px;color:var(--ink2);margin-top:6px}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.tile.ok::before{background:var(--good)}
.tile.warn{border-color:var(--bad)}.tile.warn b{color:var(--bad)}.tile.warn::before{background:var(--bad)}
.tile.act{border-color:var(--acc)}.tile.act b{color:var(--acc)}.tile.act::before{background:var(--acc)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.card h2::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--pri)}
.card h2 b{font-weight:400;font-size:13px;color:var(--ink3);margin-left:auto;font-family:"BIZ UDPGothic",sans-serif}
.hint{font-size:13.5px;color:var(--ink3);margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 12px;border-top:1px solid var(--line2);text-align:left;vertical-align:top}
th{border-top:0;color:var(--ink3);font-weight:700;font-size:12.5px;letter-spacing:.03em;background:var(--paper2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.tbl{overflow-x:auto;border:1px solid var(--line2);border-radius:12px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--line2);color:var(--ink2);white-space:nowrap;line-height:1.6}
.chip.r{background:var(--bad-s);color:var(--bad)}.chip.a{background:var(--warn-s);color:var(--warn)}.chip.g{background:var(--good-s);color:var(--good)}.chip.b{background:var(--pri-s);color:var(--pri)}.chip.p{background:var(--acc-s);color:var(--acc)}
.row{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line2);align-items:flex-start}
.row:first-of-type{border-top:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:none;color:var(--ink2)}
.ic.r{background:var(--bad-s);color:var(--bad)}.ic.a{background:var(--warn-s);color:var(--warn)}.ic.g{background:var(--good-s);color:var(--good)}.ic.b{background:var(--pri-s);color:var(--pri)}.ic.p{background:var(--acc-s);color:var(--acc)}
.t{flex:1;min-width:0}.t b{display:block;font-size:15.5px;line-height:1.5}.t small{display:block;color:var(--ink2);font-size:13.5px;margin-top:2px}
.btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:15px;font-weight:700;padding:9px 20px;border-radius:12px;cursor:pointer;transition:transform .05s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.decide-card{border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;background:var(--paper)}
.decide-card .src{font-size:13px;color:var(--ink3);font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.decide-card .ttl{font-size:19px;font-weight:700;line-height:1.45}
.decide-card .dt{font-size:14.5px;color:var(--ink2);margin-top:6px}
.decide-card .plan{font-size:14.5px;margin-top:10px;padding:10px 12px;background:var(--pri-s);border-radius:10px;color:var(--pri)}
.decide-card .btns .btn{flex:1;min-width:110px;text-align:center;padding:12px 16px;font-size:16px}
.ai{background:var(--warn-s);border-left:5px solid var(--warn);border-radius:0 12px 12px 0;padding:12px 16px;font-size:14.5px;margin:10px 0;white-space:pre-line;line-height:1.7}
.line{background:var(--good-s);border-radius:18px 18px 18px 4px;padding:14px 16px;font-size:15px;line-height:1.65;white-space:pre-line;margin:10px 0}
.line.stop{background:var(--bad-s)}.line .who{display:block;font-size:12px;color:var(--ink3);font-weight:700;margin-bottom:4px}
.draft{background:var(--pri-s);border-left:5px solid var(--pri);border-radius:0 12px 12px 0;padding:12px 16px;font-size:14.5px;margin:10px 0;white-space:pre-line}
.draft small{display:block;color:var(--ink3);font-size:12.5px;margin-top:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:2px solid var(--line);background:var(--paper);color:var(--ink2);font:inherit;font-size:14.5px;font-weight:700;padding:7px 16px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.gantt{display:grid;grid-template-columns:170px 1fr;gap:7px 12px;font-size:13.5px;align-items:center}
.gbar{position:relative;height:22px;background:var(--line2);border-radius:6px;overflow:hidden}
.gbar i{position:absolute;top:0;bottom:0;background:var(--pri);border-radius:6px}
.gbar i.done{background:var(--good)}.gbar i.plan{background:var(--line)}
.gbar em{position:absolute;top:0;bottom:0;width:3px;background:var(--acc)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink3);margin-bottom:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.empty{color:var(--ink3);font-size:14.5px;padding:8px 0}
.ask{display:flex;gap:10px;margin-bottom:12px}
.ask input{flex:1;border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-size:16px;background:var(--paper);color:var(--ink);font-family:inherit}
.conn{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.conn .c{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);border-top:5px solid var(--good)}
.conn .c.w{border-top-color:var(--warn)}.conn .c.x{border-top-color:var(--line)}
.conn .c h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
.conn .c p{margin:0;font-size:14px;color:var(--ink2)}
.conn .c small{display:block;font-size:12.5px;color:var(--ink3);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2)}
.bal{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--pri);color:#fff;padding:10px 20px;border-radius:999px;font-size:14.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;box-shadow:var(--shadow)}
.toast.show{opacity:1}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;left:0;right:0;bottom:0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;gap:0;z-index:5}aside .brand,aside .co,aside .foot,aside .sep{display:none}aside button{flex-direction:column;gap:3px;font-size:11px;padding:5px 6px;flex:1 0 auto;min-width:64px;border-radius:8px}aside button .n{margin:0;position:absolute;right:8px;top:0}main{padding:0 16px 100px}.cols{grid-template-columns:1fr}.date b{min-width:100px}.top h1{font-size:22px}.tile b{font-size:24px}.greet p{font-size:15.5px}.decide-card .ttl{font-size:17px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .g{width:100%;max-width:360px;text-align:center}
#gate .mk{width:72px;height:72px;margin:0 auto 14px}
#gate h2{font-size:20px;margin:0 0 4px}
#gate p{color:var(--ink-2,var(--ink2,#666));font-size:14px;margin:0 0 18px}
#gate input{width:100%;font-size:26px;letter-spacing:.35em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--paper,#fff);color:var(--ink);font-family:inherit;font-variant-numeric:tabular-nums}
#gate button{margin-top:12px;width:100%;padding:13px;border-radius:999px;border:0;background:#0f3d5c;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
#gate .err{color:#c23b3b;font-size:13px;min-height:20px;margin-top:8px}
#gate small{display:block;color:var(--ink-3,#888);font-size:12px;margin-top:14px}
</style>
<div id="gate" hidden><form class="g" onsubmit="return gateTry(event)">
<svg class="mk" viewBox="0 0 200 200" aria-hidden="true"><rect x="0" y="0" width="200" height="200" rx="44" fill="#0f3d5c"/><path d="M22 84 L100 28 L178 84" fill="none" stroke="#e8752a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><rect x="91" y="56" width="18" height="44" rx="2" fill="#fff"/><rect x="44" y="92" width="112" height="18" rx="2" fill="#fff"/><path d="M100 104 L52 172" stroke="#fff" stroke-width="24" stroke-linecap="square"/><path d="M100 104 L148 172" stroke="#fff" stroke-width="24" stroke-linecap="square"/></svg>
<h2>AI秘書（試作）</h2><p>大和田建設・架空データ。パスコードを入力してください</p>
<input id="gpass" type="tel" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="••••" aria-label="パスコード">
<button type="submit">開く</button><div class="err" id="gerr"></div>
<small>パスコードは提供元（加賀）からお伝えします</small></form></div>
<div class="app">
<aside>
  <div class="brand"><em>秘</em>AI秘書</div><div class="co"><svg viewBox="0 0 200 200" width="22" height="22" aria-hidden="true" style="vertical-align:-5px;margin-right:6px"><rect x="0" y="0" width="200" height="200" rx="44" fill="#fff"/><path d="M22 84 L100 28 L178 84" fill="none" stroke="#e8752a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><rect x="91" y="56" width="18" height="44" rx="2" fill="#0f3d5c"/><rect x="44" y="92" width="112" height="18" rx="2" fill="#0f3d5c"/><path d="M100 104 L52 172" stroke="#0f3d5c" stroke-width="24" stroke-linecap="square"/><path d="M100 104 L148 172" stroke="#0f3d5c" stroke-width="24" stroke-linecap="square"/></svg><span id="co"></span></div>
  <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今日</button>
  <button data-v="decide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>決める<span class="n" id="ndec"></span></button>
  <button data-v="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4l5 7 5-7M12 11v9M8 14h8M8 17h8"/></svg>お金</button>
  <button data-v="sites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>工事</button>
  <button data-v="calls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>会話</button>
  <button data-v="genba"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/></svg>現場LINE</button>
  <div class="sep"></div>
  <button data-v="conn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M13 4l4 4-4 4M20 16H7M11 12l-4 4 4 4"/></svg>連携状態</button>
  <button data-v="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5M12 17h.01"/></svg>AIに聞く</button>
  <div class="foot">試作 v0.2・架空データ（9月）<br>管理者：社長・幹部・経理</div>
</aside>
<main>
  <div class="top"><h1 id="title">今日</h1><div class="live"><span><i class="dot"></i>ローカルAI 稼働</span><span><i class="dot"></i>LINE</span><span><i class="dot w"></i>電話 未接続</span></div>
    <div class="date"><button id="prev" aria-label="前の日">‹</button><b id="dlabel"></b><button id="next" aria-label="次の日">›</button><input type="range" id="slider" min="0" max="0" value="0" aria-label="表示日"></div></div>
  <div id="main"></div>

<script>
const PASSCODE = "0921";
function gateOk() { try { return localStorage.getItem("mio_gate") === PASSCODE; } catch (e) { return false; } }
