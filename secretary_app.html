<title>AI秘書 大和田建設</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<style>
/* restyle-x */
:root{--bg:#ffffff;--paper:#ffffff;--paper2:#f7f9f9;--ink:#0f1419;--ink-2:#536471;--ink-3:#8b98a5;--line:#eff3f4;--line2:#eff3f4;--navy:#0f3d5c;--blue:#1d9bf0;--blue-soft:#e8f5fd;--acc:#e8752a;--acc-soft:#fdebdc;--amber:#c98a12;--amber-soft:#fbf0d5;--red:#f4212e;--red-soft:#fde8ea;--green:#00ba7c;--green-soft:#e6f7f0;--purple:#7856ff;--purple-soft:#efeaff;--nav:#ffffff;--btn:#0f1419;--btn-ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--paper:#000000;--paper2:#16181c;--ink:#e7e9ea;--ink-2:#71767b;--ink-3:#5b6168;--line:#2f3336;--line2:#2f3336;--navy:#9cc3e0;--blue:#1d9bf0;--blue-soft:#0d2233;--acc:#f0925a;--acc-soft:#3d2a1c;--amber:#e0b060;--amber-soft:#3a3120;--red:#f4212e;--red-soft:#3a1a1e;--green:#00ba7c;--green-soft:#0f2b21;--purple:#a58fff;--purple-soft:#24203a;--nav:#000000;--btn:#eff3f4;--btn-ink:#0f1419}}
:root[data-theme="dark"]{--bg:#000000;--paper:#000000;--paper2:#16181c;--ink:#e7e9ea;--ink-2:#71767b;--ink-3:#5b6168;--line:#2f3336;--line2:#2f3336;--navy:#9cc3e0;--blue:#1d9bf0;--blue-soft:#0d2233;--acc:#f0925a;--acc-soft:#3d2a1c;--amber:#e0b060;--amber-soft:#3a3120;--red:#f4212e;--red-soft:#3a1a1e;--green:#00ba7c;--green-soft:#0f2b21;--purple:#a58fff;--purple-soft:#24203a;--nav:#000000;--btn:#eff3f4;--btn-ink:#0f1419}
*{box-sizing:border-box;min-width:0}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",-apple-system,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
.phone{max-width:600px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:72px;overflow-x:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 14px}
header h1{margin:0;height:52px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
header h1::before{content:"秘";display:inline-flex;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;font-weight:800;align-items:center;justify-content:center;flex:none}
header h1 span{display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:var(--ink);margin-left:auto}
header h1 span svg rect{fill:var(--navy)}
.datebar{display:flex;align-items:center;gap:6px;height:44px;border-top:1px solid var(--line)}
.datebar button{background:none;color:var(--ink);border:0;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}
.datebar button:hover{background:var(--paper2)}
.datebar input[type=range]{flex:1;accent-color:var(--ink);height:4px}
.datebar .d{font-size:14px;font-weight:700;min-width:104px;text-align:center;font-variant-numeric:tabular-nums}
main{padding:0}
.hint{font-size:13px;color:var(--ink-2);margin:0;padding:10px 16px;border-bottom:1px solid var(--line)}
/* 投稿（タイムライン） */
.post{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.post .av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:var(--navy);color:#fff}
.post .av.r{background:var(--red);color:#fff}.post .av.g{background:var(--green);color:#fff}.post .av.a{background:var(--amber);color:#fff}.post .av.b{background:var(--blue);color:#fff}.post .av.p{background:var(--purple);color:#fff}.post .av.o{background:var(--acc);color:#fff}
.post .bd{flex:1;min-width:0}
.post .hd{display:flex;align-items:baseline;gap:6px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}
.post .hd b{color:var(--ink);font-size:15px}
.post .hd .tag{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--paper2);border-radius:999px;padding:1px 8px}
.post .hd .tag.r{color:var(--red);background:var(--red-soft)}.post .hd .tag.o{color:var(--acc);background:var(--acc-soft)}.post .hd .tag.g{color:var(--green);background:var(--green-soft)}
.post .tx{font-size:15.5px;line-height:1.6;margin-top:2px;white-space:pre-line}
.post .tx b{font-weight:700}
.post .qt{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:14px;color:var(--ink-2);background:var(--paper2)}
.post .qt b{color:var(--ink);display:block;font-size:15px}
.post .num{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.post .num.r{color:var(--red)}
.post .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;flex:1;min-width:0;white-space:nowrap;text-align:center}
.pill.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.pill.done{opacity:.5}
.post .meta{display:flex;gap:18px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.post .meta span{cursor:pointer}
.big{font-size:17px;font-weight:700;line-height:1.5}
/* 既存の画面（お金・工事・会話・現場LINE）のフラット化 */
.card{background:var(--bg);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 16px 14px;margin:0;box-shadow:none}
.card h2{margin:0 0 8px;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.card h2 b{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--paper2);color:var(--ink-2);margin-left:auto}
.row{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.row:first-of-type{border-top:0}
.row .ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--paper2);color:var(--ink-2);flex:none}
.ic.r{background:var(--red);color:#fff}.ic.g{background:var(--green);color:#fff}.ic.a{background:var(--amber);color:#fff}.ic.b{background:var(--blue);color:#fff}.ic.p{background:var(--purple);color:#fff}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;line-height:1.45}
.row .t small{color:var(--ink-2);font-size:13px;display:block;margin-top:2px}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.stat{background:var(--paper2);border:0;border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink-2)}
.stat.warn b{color:var(--red)}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--paper2);color:var(--ink-2);margin-right:4px;vertical-align:middle;white-space:nowrap}
.chip.r{background:var(--red-soft);color:var(--red)}.chip.g{background:var(--green-soft);color:var(--green)}.chip.a{background:var(--amber-soft);color:var(--amber)}.chip.b{background:var(--blue-soft);color:var(--blue)}.chip.p{background:var(--purple-soft);color:var(--purple)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;flex:1;min-width:0;white-space:nowrap}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.done{opacity:.5}
.dc{border-bottom:1px solid var(--line);padding:12px 16px}
.ai{background:var(--paper2);border:0;border-radius:14px;padding:10px 14px;font-size:14.5px;margin:8px 0;white-space:pre-line;line-height:1.6}
.empty{color:var(--ink-2);font-size:14px;padding:12px 0}
.line{background:var(--paper2);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:15px;line-height:1.6;white-space:pre-line;margin:8px 0;position:relative}
.line.stop{background:var(--red-soft)}
.line .who{display:block;font-size:12px;color:var(--ink-2);font-weight:700;margin-bottom:4px}
.draft{background:var(--paper2);border-left:3px solid var(--blue);border-radius:0 12px 12px 0;padding:10px 14px;font-size:14.5px;margin:8px 0;white-space:pre-line}
.draft small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:4px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:var(--nav);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--ink);font-size:10.5px;font-weight:500;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-family:inherit;min-width:0}
nav button svg{width:26px;height:26px;stroke-width:1.8}
nav button.on{font-weight:800}
nav button.on svg{stroke-width:2.6}
nav button .n{position:absolute;right:calc(50% - 22px);top:-2px;background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 6px;line-height:17px}
.tabs{display:flex;gap:0;margin:0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;border-radius:0;padding:12px 14px;font-size:14.5px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink-2);font-family:inherit;position:relative;flex:1 0 auto}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:4px;border-radius:2px;background:var(--blue)}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{border-top:0;color:var(--ink-2);font-weight:700;font-size:12px}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.tw td:nth-child(3),.tw th:nth-child(3){white-space:nowrap}
.bal{height:130px;width:100%;display:block;max-width:100%}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
.ask{display:flex;gap:8px;margin:12px 16px 4px}
.ask input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:15px;background:var(--paper2);color:var(--ink);font-family:inherit;min-width:0}
.fab{position:fixed;right:max(16px,calc(50% - 300px + 16px));bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;border:0;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:6;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.timebar{display:flex;align-items:center;gap:10px;height:40px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.timebar .now{font-weight:800;color:var(--ink);min-width:92px;font-variant-numeric:tabular-nums}
.timebar .now i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.timebar .now i{animation:none}}
.timebar input[type=range]{flex:1;accent-color:var(--blue);height:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:16px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.grid.one{grid-template-columns:1fr}
.grid a{position:relative;display:block;background:var(--paper2)}
.grid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.grid.one img{aspect-ratio:16/10}
.grid .more{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.reads{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reads span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper2);color:var(--ink-2)}
.reads span.ok::before{content:"\2713 ";color:var(--green)}
.reads span.ng{background:var(--acc-soft);color:var(--acc)}.reads span.ng::before{content:"? "}
.nowline{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:12.5px;color:var(--blue);font-weight:700}
.nowline::before,.nowline::after{content:"";flex:1;height:2px;background:var(--blue);opacity:.5}

#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .g{width:100%;max-width:360px;text-align:center}
#gate .mk{width:72px;height:72px;margin:0 auto 14px}
#gate h2{font-size:20px;margin:0 0 4px}
#gate p{color:var(--ink-2,var(--ink2,#666));font-size:14px;margin:0 0 18px}
#gate input{width:100%;font-size:26px;letter-spacing:.35em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--paper,#fff);color:var(--ink);font-family:inherit;font-variant-numeric:tabular-nums}
#gate button{margin-top:12px;width:100%;padding:13px;border-radius:999px;border:0;background:#0f3d5c;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
#gate .err{color:#c23b3b;font-size:13px;min-height:20px;margin-top:8px}
#gate small{display:block;color:var(--ink-3,#888);font-size:12px;margin-top:14px}
</style>
<div id="gate" hidden><form class="g" onsubmit="return gateTry(event)">
<svg class="mk" viewBox="0 0 200 200" aria-hidden="true"><rect x="0" y="0" width="200" height="200" rx="44" fill="#0f3d5c"/><path d="M22 84 L100 28 L178 84" fill="none" stroke="#e8752a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><rect x="91" y="56" width="18" height="44" rx="2" fill="#fff"/><rect x="44" y="92" width="112" height="18" rx="2" fill="#fff"/><path d="M100 104 L52 172" stroke="#fff" stroke-width="24" stroke-linecap="square"/><path d="M100 104 L148 172" stroke="#fff" stroke-width="24" stroke-linecap="square"/></svg>
<h2>AI秘書（試作）</h2><p>大和田建設・架空データ。パスコードを入力してください</p>
<input id="gpass" type="tel" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="••••" aria-label="パスコード">
<button type="submit">開く</button><div class="err" id="gerr"></div>
<small>パスコードは提供元（加賀）からお伝えします</small></form></div>
<div class="phone">
<header>
  <h1>AI秘書 <span><svg viewBox="0 0 200 200" width="20" height="20" aria-hidden="true" style="vertical-align:-5px;margin-right:6px"><rect x="0" y="0" width="200" height="200" rx="44" fill="#fff"/><path d="M22 84 L100 28 L178 84" fill="none" stroke="#e8752a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><rect x="91" y="56" width="18" height="44" rx="2" fill="#0f3d5c"/><rect x="44" y="92" width="112" height="18" rx="2" fill="#0f3d5c"/><path d="M100 104 L52 172" stroke="#0f3d5c" stroke-width="24" stroke-linecap="square"/><path d="M100 104 L148 172" stroke="#0f3d5c" stroke-width="24" stroke-linecap="square"/></svg><span id="co"></span></span></h1>
  <div class="datebar"><button id="prev">‹</button><div class="d" id="dlabel"></div><button id="next">›</button><input type="range" id="slider" min="0" max="0" value="0"></div>
  <div class="timebar"><span class="now" id="tlabel"></span><input type="range" id="tslider" min="360" max="1140" step="5" value="1140" aria-label="時刻"><span class="tend">19:00</span></div>
</header>
<main id="main"></main>
<nav>
  <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今日</button>
  <button data-v="decide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>決める<span class="n" id="ndec"></span></button>
  <button data-v="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4l5 7 5-7M12 11v9M8 14h8M8 17h8"/></svg>お金</button>
  <button data-v="sites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>工事</button>
  <button data-v="calls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>会話</button>
  <button data-v="genba"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/></svg>現場LINE</button>
</nav>
<div class="toast" id="toast"></div>
</div>
<script>
const PASSCODE = "0921";
function gateOk() { try { return localStorage.getItem("mio_gate") === PASSCODE; } catch (e) { return false; } }

  $("#main").innerHTML = { today: renderToday, decide: renderDecide, money: renderMoney, sites: renderSites, calls: renderCalls, genba: renderGenba }[view](b);
  window.scrollTo(0, 0);
}
$("#prev").onclick = () => { idx = Math.max(0, idx - 1); render(); };
$("#next").onclick = () => { idx = Math.min(DATA.briefs.length - 1, idx + 1); render(); };
$("#slider").oninput = e => { idx = +e.target.value; render(); };
$("#tslider").oninput = e => { tmin = +e.target.value; if (view !== "today") view = "today"; render(); };
document.querySelectorAll("nav button").forEach(x => x.onclick = () => go(x.dataset.v));
tmin = 860; render();
</script>
